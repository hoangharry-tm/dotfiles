# Kitty (Arch/niri, macOS). Installed by Nix on Linux (hh-nix-config,
# modules/programs/kitty.nix, nixGL-wrapped). Mirrors alacritty.toml: same
# font, translucency and padding, so niri's glass blur treats both alike.

# Colours: Kanagawa Wave is the base and the fallback (macOS, or before
# matugen has run). The wallpaper palette from matugen overrides it when
# present (a missing include is ignored); drop the second line to stay on
# Kanagawa. The `wallpaper` script reloads running kittys with SIGUSR1.
include themes/kanagawa_wave.conf
include ~/.local/state/theme/kitty.conf

# Per-OS bits: linux.conf (Wayland, no decorations) / macos.conf.
include ${KITTY_OS}.conf

# ── Font ─────────────────────────────────────────────────────────────────────
# Nerd Font from modules/fonts.nix; kitty falls back to its built-in Symbols
# Nerd Font for icons anyway.
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.5
disable_ligatures never

# ── Window: glass ────────────────────────────────────────────────────────────
# 0.9 like alacritty. niri blurs what is behind (rules.kdl); the sheet is
# never faded by the compositor, kitty only dims its own background.
background_opacity   0.9
# 12px at 96 dpi (4-pt scale, equals the window radius); kitty counts in pt.
window_padding_width 9
remember_window_size no
confirm_os_window_close 0

# ── Cursor, mouse, bell ──────────────────────────────────────────────────────
cursor_shape            block
cursor_shape_unfocused  hollow
cursor_blink_interval   0
cursor_trail            0
mouse_hide_wait         -1
copy_on_select          clipboard
scrollback_lines        10000
enable_audio_bell       no
visual_bell_duration    0
window_alert_on_bell    no
bell_on_tab             no
url_style               single
# zsh/p10k already draw their own prompt; no shell integration injection
# (keeps startup untouched).
shell_integration       disabled

# ── Tabs: minimal, only shown with 2+ ────────────────────────────────────────
tab_bar_style       fade
tab_fade            0.25 0.5 0.75 1
tab_bar_min_tabs    2
tab_bar_edge        bottom
tab_title_template  " {index}  {title} "
active_tab_font_style   bold
inactive_tab_font_style normal

# ── Remote control: live recolour and scripting ──────────────────────────────
# Socket-only (no escape-code control from untrusted output). Abstract socket,
# one per kitty process: kitty @ --to unix:@kitty-<pid> ...
allow_remote_control socket-only
listen_on            unix:@kitty-{kitty_pid}

# ── Keys ─────────────────────────────────────────────────────────────────────
# Shift+Enter inserts a newline without submitting (e.g. in Claude Code)
map shift+enter send_text all \x1b\r
