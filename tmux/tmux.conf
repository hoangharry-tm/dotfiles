set-option -sa terminal-overrides ",xterm*:Tc"
set-option -sa terminal-overrides ",alacritty:RGB"
set -g mouse on

# ── Prefix ────────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "  Config reloaded"

# ── General ───────────────────────────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#S — #W"
set -sg escape-time 0
set -g history-limit 10000

# ── Vi mode ───────────────────────────────────────────────────────────────────
setw -g mode-keys vi
bind-key -T copy-mode-vi v   send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y   send-keys -X copy-selection-and-cancel

# ── Pane navigation ───────────────────────────────────────────────────────────
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

bind -n S-Left  previous-window
bind -n S-Right next-window

bind -   split-window -v -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"

# ── Theme ─────────────────────────────────────────────────────────────────────
# Minimal status line. Neutral defaults first (macOS, or before matugen has
# run); on Linux the wallpaper palette (matugen template tmux.conf) is
# sourced after and overrides the colours. `-q` makes a missing file fine.
set -g status on
set -g status-interval 15
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=default,fg=colour245"
set -g status-left " #[bold]#S#[nobold]  "
set -g status-right " %H:%M "
set -g window-status-format " #I #W "
set -g window-status-current-format " #I #W "
set -g window-status-current-style "fg=colour39,bold"
set -g window-status-separator ""
set -g pane-border-lines single
set -g pane-active-border-style "fg=colour39"
source-file -q ~/.local/state/theme/tmux.conf

# ── Plugins ───────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

# Session persistence
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'
set -g @resurrect-capture-pane-contents 'on'

# Session switcher
set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-bind 'o'

# fzf picker for windows/sessions/panes/commands
set -g @plugin 'sainnhe/tmux-fzf'
TMUX_FZF_LAUNCH_KEY="f"

# Fuzzy text extractor from pane output
set -g @plugin 'laktak/extrakto'
set -g @extrakto_key 'tab'
set -g @extrakto_split_direction 'v'

# Keyboard-driven link/path picker
set -g @plugin 'Morantron/tmux-fingers'
set -g @fingers-key 'F'

# Open highlighted URLs/files
set -g @plugin 'tmux-plugins/tmux-open'
set -g @open-S 'https://www.google.com/search?q='

# Auto-install TPM plugins on a fresh machine (first launch)
if "test ! -d ~/.tmux/plugins/tmux-sensible" "run '~/.tmux/plugins/tpm/bin/install_plugins'"
run '~/.tmux/plugins/tpm/tpm'
