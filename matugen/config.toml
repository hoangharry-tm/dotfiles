# matugen: Material You palette from the wallpaper -> templates below.
# Run via `wallpaper set <image>` (hh-nix-config, modules/theme.nix), which
# also reloads the apps. Outputs are generated state, not tracked in git.

[config]

# Hues for terminals/editors. Material has no green/yellow/...; matugen
# harmonises these toward the wallpaper's primary so ANSI colours still
# read as red/green/etc. but belong to the palette.
[config.custom_colors]
red = "#e06c75"
orange = "#d19a66"
yellow = "#e5c07b"
green = "#98c379"
cyan = "#56b6c2"
blue = "#61afef"
magenta = "#c678dd"

[templates.niri]
input_path = "~/.config/matugen/templates/niri.kdl"
output_path = "~/.local/state/theme/niri.kdl"

[templates.quickshell]
input_path = "~/.config/matugen/templates/quickshell.json"
output_path = "~/.local/state/theme/quickshell.json"

[templates.swaylock]
input_path = "~/.config/matugen/templates/swaylock.conf"
output_path = "~/.local/state/theme/swaylock.conf"

# --- Toolkits and apps (added with modules/theming.nix) -------------------
# GTK: libadwaita and adw-gtk3 both read @define-color overrides from
# gtk.css. Same template, both versions. Existing files are backed up by
# the home-manager activation step before the first write.
[templates.gtk3]
input_path = "~/.config/matugen/templates/gtk.css"
output_path = "~/.config/gtk-3.0/gtk.css"

[templates.gtk4]
input_path = "~/.config/matugen/templates/gtk.css"
output_path = "~/.config/gtk-4.0/gtk.css"

[templates.qt6ct]
input_path = "~/.config/matugen/templates/qtct.conf"
output_path = "~/.local/state/theme/qtct.conf"

# Terminal and CLI. alacritty and btop pick these up from the state dir.
[templates.alacritty]
input_path = "~/.config/matugen/templates/alacritty.toml"
output_path = "~/.local/state/theme/alacritty.toml"

[templates.yazi]
input_path = "~/.config/matugen/templates/yazi.toml"
output_path = "~/.config/yazi/theme.toml"

[templates.btop]
input_path = "~/.config/matugen/templates/btop.theme"
output_path = "~/.config/btop/themes/matugen.theme"

# Neovim: opt-in via `:colorscheme matugen` (nvim/colors/matugen.lua).
[templates.nvim]
input_path = "~/.config/matugen/templates/nvim.lua"
output_path = "~/.local/state/theme/nvim.lua"

# fcitx5 candidate popup (modules/input-method.nix selects Theme=matugen).
# Reload with `fcitx5-remote -r` after a wallpaper change.
[templates.fcitx5]
input_path = "~/.config/matugen/templates/fcitx5.conf"
output_path = "~/.local/share/fcitx5/themes/matugen/theme.conf"

# tmux status line/borders: sourced by tmux.conf (optional include) and
# live-reloaded by the `wallpaper` script.
[templates.tmux]
input_path = "~/.config/matugen/templates/tmux.conf"
output_path = "~/.local/state/theme/tmux.conf"

# Firefox chrome (tabs, URL bar); imported by userChrome.css, applies on
# browser restart (see modules/browser.nix).
[templates.firefox]
input_path = "~/.config/matugen/templates/firefox.css"
output_path = "~/.local/state/theme/firefox.css"

# NeoMutt colours (truecolor); sourced by ~/.config/neomutt/neomuttrc
# (modules/mail.nix). Picked up on the next neomutt start.
[templates.neomutt]
input_path = "~/.config/matugen/templates/neomutt.muttrc"
output_path = "~/.local/state/theme/neomutt-colors.muttrc"
