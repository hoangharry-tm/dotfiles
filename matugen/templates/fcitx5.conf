# Generated by matugen into ~/.local/share/fcitx5/themes/matugen/theme.conf.
# Dark glass-like candidate popup; colours follow the wallpaper palette.
[Metadata]
Name=matugen
Version=1
Author=matugen
Description=Wallpaper-derived theme

[InputPanel]
NormalColor={{colors.on_surface.default.hex}}
HighlightCandidateColor={{colors.on_primary_container.default.hex}}
HighlightColor={{colors.on_surface.default.hex}}
HighlightBackgroundColor={{colors.primary_container.default.hex}}
Spacing=4

[InputPanel/TextMargin]
Left=12
Right=12
Top=8
Bottom=8

[InputPanel/ContentMargin]
Left=2
Right=2
Top=2
Bottom=2

[InputPanel/Background]
Color={{colors.surface_container.default.hex}}
BorderColor={{colors.outline_variant.default.hex}}
BorderWidth=1

[InputPanel/Background/Margin]
Left=2
Right=2
Top=2
Bottom=2

[InputPanel/Highlight]
Color={{colors.primary_container.default.hex}}
BorderColor={{colors.primary_container.default.hex}}
BorderWidth=0

[InputPanel/Highlight/Margin]
Left=8
Right=8
Top=4
Bottom=4
