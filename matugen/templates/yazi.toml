# Generated by matugen. Do not edit; see ~/.config/matugen.
[mgr]
cwd = { fg = "{{colors.primary.default.hex}}" }
hovered = { fg = "{{colors.on_primary_container.default.hex}}", bg = "{{colors.primary_container.default.hex}}" }
tab_active = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
tab_inactive = { fg = "{{colors.on_surface_variant.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }
border_style = { fg = "{{colors.outline_variant.default.hex}}" }

[mode]
normal_main = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
normal_alt = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }

[status]
overall = { bg = "{{colors.surface_container.default.hex}}" }
progress_normal = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }

[filetype]
rules = [
  { mime = "inode/directory", fg = "{{colors.primary.default.hex}}", bold = true },
  { mime = "image/*", fg = "{{colors.tertiary.default.hex}}" },
  { mime = "{audio,video}/*", fg = "{{colors.secondary.default.hex}}" },
  { mime = "application/{zip,gzip,x-tar,x-bzip*,x-xz,x-7z-compressed}", fg = "{{colors.error.default.hex}}" },
]
