set -g status-style "bg={{colors.surface.default.hex}},fg={{colors.on_surface_variant.default.hex}}"
set -g status-left "#[fg={{colors.primary.default.hex}},bold] #S #[default] "
set -g status-right "#[fg={{colors.outline.default.hex}}] %H:%M "
set -g window-status-style "fg={{colors.on_surface_variant.default.hex}}"
