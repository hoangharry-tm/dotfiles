[General]
DisableDefaultImports=false

[Warnings]
# Quickshell registers its windows/attached types in ways qmllint cannot see
# (PanelWindow "not creatable", anchors.*, UntypedObjectModel.values), and
# the shell leans on ids and singletons from nested scopes by design.
UncreatableType=disable
UnqualifiedAccess=disable
MissingProperty=disable
UnresolvedType=disable
UnusedImports=warning
IdShadowsMember=warning
PropertyOverride=warning
DuplicatePropertyBinding=warning
