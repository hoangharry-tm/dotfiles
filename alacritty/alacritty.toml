# Alacritty (Arch/niri). Installed by Nix (hh-nix-config,
# modules/programs/alacritty.nix), wrapped with nixGL for GPU access.

[general]
# Later imports win. Kanagawa Wave (official kanagawa.nvim palette) is the
# base and the fallback (macOS, or before matugen has run). The wallpaper
# palette generated by matugen overrides it when present (a missing import
# is only logged); remove the second entry to stay on Kanagawa.
import = [
  "~/.config/alacritty/themes/kanagawa_wave.toml",
  "~/.local/state/theme/alacritty.toml",
]
live_config_reload = true

[window]
opacity = 0.9
padding = { x = 12, y = 12 }  # = kitty (9 pt = 12 px), window radius 12, shell row padding
dynamic_padding = true  # spread leftover pixels evenly instead of at the edge
decorations = "None"    # niri draws no title bars; keep it borderless

[font]
# "monospace" resolves via fontconfig (hh-nix-config modules/fonts.nix):
# JetBrainsMono Nerd Font Mono, then system fonts as fallback.
size = 10.5
normal = { family = "monospace", style = "Regular" }
bold = { family = "monospace", style = "Bold" }
italic = { family = "monospace", style = "Italic" }
bold_italic = { family = "monospace", style = "Bold Italic" }

[cursor]
style = { shape = "Block", blinking = "Off" }
unfocused_hollow = true

[scrolling]
history = 10000

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true

[[keyboard.bindings]]
# Shift+Enter inserts a newline without submitting (e.g. in Claude Code)
key = "Return"
mods = "Shift"
chars = "\u001B\r"
