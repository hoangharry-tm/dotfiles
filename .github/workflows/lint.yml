# qmllint over the Quickshell config. Lives here (not in hh-nix-config)
# because this repo holds the QML. Run locally: see quickshell/lint.sh.
name: lint
on:
  push:
    paths: ["quickshell/**", ".github/workflows/lint.yml"]
  pull_request:
    paths: ["quickshell/**", ".github/workflows/lint.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qmllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: qmllint
        run: |
          # Both come from cache.nixos.org; Quickshell supplies the qmltypes
          # for its own modules, qtdeclarative the linter and Qt's modules.
          qt=$(nix build --no-link --print-out-paths nixpkgs#qt6.qtdeclarative | head -n1)
          qs=$(nix build --no-link --print-out-paths nixpkgs#quickshell | head -n1)
          export PATH="$qt/bin:$PATH"
          export QS_QML="$qs/lib/qt-6/qml" QT_QML="$qt/lib/qt-6/qml"
          ./quickshell/lint.sh
